<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Common Ground</title>
  <meta name="description" content="Find the fairest place for a group to meet, balancing everyone's drive time.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="panel" id="panel">
      <header class="brand">
        <h1>Common Ground</h1>
      </header>

      <section class="card" aria-labelledby="add-h">
        <h2 id="add-h">Add person</h2>
        <form id="add-form" autocomplete="off">
          <label for="add-name" hidden>Name</label>
          <input id="add-name" type="text" placeholder="Name" maxlength="40">
          <label for="add-query" hidden>Postcode or address</label>
          <div class="row">
            <input id="add-query" type="text" placeholder="Postcode or address" required>
            <button type="submit" class="btn primary">Find</button>
          </div>
        </form>
        <ul id="search-results" class="results" hidden></ul>
        <details class="bulk">
          <summary>Paste list</summary>
          <textarea id="bulk-text" rows="5" placeholder="Name, postcode"></textarea>
          <button id="bulk-add" class="btn" type="button">Add all</button>
        </details>
        <p id="add-msg" class="msg" role="status" aria-live="polite"></p>
      </section>

      <section class="card" aria-labelledby="people-h">
        <div class="card-head">
          <h2 id="people-h">People <span id="people-count" class="count">0/30</span></h2>
          <div class="head-actions">
            <button id="share-btn" class="btn small" type="button">Share</button>
            <button id="clear-btn" class="btn small ghost" type="button">Clear</button>
          </div>
        </div>
        <ol id="people" class="people"></ol>
        <p id="people-empty" class="empty" hidden></p>
      </section>

      <section class="card" aria-labelledby="balance-h">
        <h2 id="balance-h">Fairness</h2>
        <input id="alpha" type="range" min="0" max="100" value="75">
        <div class="scale"><span>Least total</span><span>Most even</span></div>
      </section>

      <section class="card" aria-labelledby="sum-h" id="summary-card">
        <h2 id="sum-h">Meeting point</h2>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div id="summary" hidden>
          <div id="place" class="place"></div>
          <dl class="stats" id="stats"></dl>
          <h3>Routes</h3>
          <ol id="routes" class="routes"></ol>
        </div>
      </section>

    </aside>
    <main class="map-wrap">
      <div id="map" aria-label="Map"></div>
      <div id="chip" class="chip" hidden aria-live="polite"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="config.js"></script>
  <script src="fairness.js"></script>
  <script src="app.js"></script>
</body>
</html>
